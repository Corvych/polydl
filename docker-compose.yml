services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-80}:${NGINX_PORT:-80}"
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - NGINX_ENVSUBST_FILTER=NGINX_PORT
    volumes:
      - ./nginx/templates:/etc/nginx/templates
    depends_on:
      - app
      - web
    restart: unless-stopped

  app:
    build: ./src
    environment:
      - DATABASE_URL=host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=${TIMEZONE}
      - PORT=3000
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BROKERS=kafka:29092
      - BOT_TOKEN=${BOT_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - app

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  bot:
    build:
      context: ./telegram
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - KAFKA_BOOTSTRAP_SERVERS=localhost:9092
      - PROXY_URL=${PROXY_URL}
      - APP_BACKEND_URL=http://localhost:3000
    depends_on:
      kafka:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
    network_mode: host

volumes:
  postgres_data:
